name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: chmod +x build.sh
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts~/nuget/*
